name: Deploy Bilieu

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 10m

          script: |
            set -euo pipefail

            APP_DIR="/root/bilieu"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"
            APP_PORT="8082"
            CONTAINER_NAME="bilieu-web"

            echo "======================================"
            echo "🚀 Deploying Bilieu"
            echo "======================================"
            echo "Branch: ${BRANCH}"
            echo "Directory: ${APP_DIR}"
            echo

            # --------------------------------------
            # Check required commands
            # --------------------------------------

            if ! command -v git >/dev/null 2>&1; then
              echo "❌ Git is not installed."
              exit 1
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo "❌ Docker is not installed on the Bilieu server."
              exit 1
            fi

            if ! docker compose version >/dev/null 2>&1; then
              echo "❌ Docker Compose v2 is not installed."
              exit 1
            fi

            echo "🐳 Docker:"
            docker --version
            docker compose version
            echo

            # --------------------------------------
            # Clone repository if necessary
            # --------------------------------------

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📥 Repository not found. Cloning..."

              rm -rf "$APP_DIR"

              git clone \
                --branch "$BRANCH" \
                "$REPO_URL" \
                "$APP_DIR"
            fi

            cd "$APP_DIR"

            # --------------------------------------
            # Update repository
            # --------------------------------------

            echo "📥 Updating repository..."

            git remote set-url origin "$REPO_URL"

            git fetch origin "$BRANCH"

            git checkout "$BRANCH"

            git reset --hard "origin/$BRANCH"

            git clean -fd

            echo
            echo "Current commit:"
            git log -1 --oneline
            echo

            # --------------------------------------
            # Validate Docker Compose
            # --------------------------------------

            echo "🔎 Validating docker-compose.yml..."

            if ! docker compose -f docker-compose.yml config >/dev/null; then
              echo "❌ docker-compose.yml is invalid."
              docker compose -f docker-compose.yml config || true
              exit 1
            fi

            echo "✅ docker-compose.yml valid."
            echo

            # --------------------------------------
            # Stop old containers
            # --------------------------------------

            echo "🛑 Stopping previous containers..."

            docker compose \
              -f docker-compose.yml \
              down \
              --remove-orphans || true

            # --------------------------------------
            # Build
            # --------------------------------------

            echo
            echo "🔨 Building Docker image..."

            docker compose \
              -f docker-compose.yml \
              build \
              --pull

            # --------------------------------------
            # Start
            # --------------------------------------

            echo
            echo "🚀 Starting Bilieu..."

            docker compose \
              -f docker-compose.yml \
              up \
              -d \
              --remove-orphans

            echo
            docker compose -f docker-compose.yml ps
            echo

            # --------------------------------------
            # Wait for container
            # --------------------------------------

            echo "⏳ Waiting for container ${CONTAINER_NAME}..."

            CONTAINER_READY=false

            for i in $(seq 1 60); do

              CONTAINER_STATE=$(
                docker inspect \
                  --format='{{.State.Status}}' \
                  "$CONTAINER_NAME" \
                  2>/dev/null || echo "missing"
              )

              HEALTH_STATE=$(
                docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                  "$CONTAINER_NAME" \
                  2>/dev/null || echo "missing"
              )

              RESTART_COUNT=$(
                docker inspect \
                  --format='{{.RestartCount}}' \
                  "$CONTAINER_NAME" \
                  2>/dev/null || echo "0"
              )

              echo "Attempt ${i}/60 - state=${CONTAINER_STATE}, health=${HEALTH_STATE}, restarts=${RESTART_COUNT}"

              if [ "$CONTAINER_STATE" = "exited" ]; then
                echo
                echo "❌ Container exited."
                docker compose -f docker-compose.yml logs --tail=200 web || true
                exit 1
              fi

              if [ "$RESTART_COUNT" -ge 3 ]; then
                echo
                echo "❌ Container keeps restarting."
                docker compose -f docker-compose.yml logs --tail=200 web || true
                exit 1
              fi

              if [ "$HEALTH_STATE" = "unhealthy" ]; then
                echo
                echo "❌ Container is unhealthy."
                docker compose -f docker-compose.yml logs --tail=200 web || true
                exit 1
              fi

              if [ "$CONTAINER_STATE" = "running" ]; then

                if [ "$HEALTH_STATE" = "healthy" ] || [ "$HEALTH_STATE" = "none" ]; then
                  CONTAINER_READY=true
                  echo "✅ Container is running."
                  break
                fi

              fi

              sleep 2
            done

            if [ "$CONTAINER_READY" != "true" ]; then
              echo
              echo "❌ Container did not become ready."

              docker compose -f docker-compose.yml ps || true
              docker compose -f docker-compose.yml logs --tail=200 web || true

              exit 1
            fi

            # --------------------------------------
            # HTTP test
            # --------------------------------------

            echo
            echo "⏳ Waiting for app on port ${APP_PORT}..."

            APP_READY=false

            for i in $(seq 1 60); do

              if curl \
                --connect-timeout 3 \
                --max-time 5 \
                -fsS \
                "http://127.0.0.1:${APP_PORT}/" \
                >/dev/null; then

                APP_READY=true
                break

              fi

              echo "Attempt ${i}/60 - application not ready yet..."
              sleep 2
            done

            if [ "$APP_READY" != "true" ]; then

              echo
              echo "❌ Bilieu did not become reachable."
              echo

              docker compose -f docker-compose.yml ps || true

              echo
              echo "============ LOGS ============"
              docker compose -f docker-compose.yml logs --tail=300 web || true

              exit 1
            fi

            # --------------------------------------
            # Success
            # --------------------------------------

            echo
            echo "======================================"
            echo "✅ BILIEU DEPLOYED SUCCESSFULLY"
            echo "======================================"
            echo
            echo "🌐 Local URL:"
            echo "http://127.0.0.1:${APP_PORT}"
            echo
            echo "Container:"
            docker ps \
              --filter "name=${CONTAINER_NAME}" \
              --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            # --------------------------------------
            # Cleanup unused images
            # --------------------------------------

            echo
            echo "🧹 Cleaning old Docker images..."

            docker image prune -f || true

            echo
            echo "✅ Deployment finished."