services:
  web:
    container_name: bilieu-web
    build: .
    restart: unless-stopped

    ports:
      - "8082:8082"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    volumes:
      - .:/app

    environment:
      - FLASK_ENV=production
