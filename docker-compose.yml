services:
  web:
    container_name: bilieu-web
    build: .
    restart: unless-stopped
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
